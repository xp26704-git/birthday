<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全场景全节日贺卡高级定制系统</title>
    <!-- 引入生成二维码的工具 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            margin: 0; padding: 0; background: #11091c;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden; color: #fff;
        }

        /* 统一卡片样式 */
        .box {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); border-radius: 24px; padding: 30px 20px;
            width: 90%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* 表单界面样式 */
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: #d1c4e9; margin-bottom: 6px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
            color: #fff; font-size: 1rem; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: #ff69b4; box-shadow: 0 0 10px rgba(255,105,180,0.5); }
        textarea { resize: none; height: 80px; font-size: 0.9rem; }

        /* 灵感备选词库区域 */
        .inspiration-box {
            background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(255, 105, 180, 0.4);
            border-radius: 12px; padding: 12px; margin-top: 8px; text-align: left;
        }
        .inspiration-title { font-size: 0.8rem; color: #ff69b4; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .inspiration-list { max-height: 150px; overflow-y: auto; padding-right: 4px; }
        .inspiration-list::-webkit-scrollbar { width: 4px; }
        .inspiration-list::-webkit-scrollbar-thumb { background: rgba(255, 105, 180, 0.5); border-radius: 4px; }
        .inspiration-item {
            font-size: 0.8rem; color: #e0e0e0; padding: 8px; border-radius: 6px;
            background: rgba(255,255,255,0.03); margin-bottom: 6px; cursor: pointer;
            line-height: 1.5; border: 1px solid transparent; word-break: break-all;
        }
        .inspiration-item:hover { background: rgba(255, 105, 180, 0.1); border-color: rgba(255, 105, 180, 0.3); color: #fff; }

        /* 样式选择列表 */
        .style-list { max-height: 300px; overflow-y: auto; margin: 15px 0; padding-right: 5px; text-align: left; }
        .style-list::-webkit-scrollbar { width: 5px; }
        .style-list::-webkit-scrollbar-thumb { background: #ff69b4; border-radius: 10px; }
        
        .style-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer;
        }
        .style-item:hover { background: rgba(255,105,180,0.15); border-color: #ff69b4; transform: scale(1.02); }
        .style-name { font-weight: bold; color: #ff8da1; font-size: 1rem; margin-bottom: 3px; }
        .style-desc { font-size: 0.8rem; color: #e0e0e0; line-height: 1.4; }

        /* 最终贺卡效果 */
        .cake-icon { font-size: 5rem; margin-bottom: 10px; display: inline-block; }
        .wobble { animation: wobbleAnim 2.5s ease-in-out infinite; }
        @keyframes wobbleAnim {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }
        h1 { font-size: 2rem; margin: 10px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .blessing { font-size: 1.1rem; line-height: 1.8; margin: 20px 0; padding: 15px; border-radius: 12px; text-align: left; word-break: break-all; }

        .lock-badge {
            background: rgba(255, 65, 108, 0.2); border: 1px solid #ff416c;
            color: #ff8da1; font-size: 0.8rem; padding: 4px 12px; border-radius: 20px;
            display: inline-block; margin-bottom: 15px; font-weight: bold;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none;
            padding: 12px 28px; border-radius: 50px; font-size: 1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4); width: 100%;
        }
        .btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        /* 二维码弹窗层 */
        .qr-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none;
        }
        .qr-mask.show { opacity: 1; pointer-events: auto; }
        .qr-box { background: #fff; padding: 25px; border-radius: 20px; text-align: center; color: #333; width: 280px; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; padding: 5px; background: #fff; }

        .particle { position: fixed; top: -10px; pointer-events: none; animation: fall linear infinite; z-index: 1; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop src="https://music.163.com/song/media/outer/url?id=4948834.mp3"></audio>

    <!-- 🔑 验证输入层 -->

        <div class="form-group">
            <input type="text" id="input-key" placeholder="请输入您的16位验证卡密..." style="text-align:center; font-size: 0.85rem; letter-spacing: 1px;">
        </div>
        <button class="btn" id="btn-auth-submit" onclick="verifyInputKey()">解锁定制大厅</button>
    </div>

    <!-- 1. 配置定制中心 -->
    <div id="step-config" class="box hidden">

            <label>1. 选择贺卡祝福主题</label>

                <option value="father">👔 父亲节贺卡</option>
                <option value="midautumn">🥮 中秋节贺卡</option>
                <option value="children">🎈 儿童节贺卡</option>
                <option value="teacher">👨‍🏫 教师节贺卡</option>
                <option value="police">👮 警察节贺卡</option>
                <option value="universal">✉️ 万能通用祝福卡</option>
            </select>
        </div>
        
        <div class="form-group">
            <label id="label-name">2. 姓名 / 称呼</label>
            <input type="text" id="input-name" placeholder="例如：宝贝、老妈、张老师" oninput="updateInspirationList()">
        </div>
        
        <div class="form-group">
            <label>3. 专属祝福寄语</label>
            <textarea id="input-custom-text" placeholder="可直接点击下方灵感文案一键复制，或在这里手写悄悄话..."></textarea>
            
            <div class="inspiration-box">
                <div class="inspiration-title">✨ 肖哥私人灵感文案库 (基于主题自动切换)</div>
                <div class="inspiration-list" id="inspiration-list"></div>
            </div>
        </div>
        
        <button class="btn" onclick="generateStyleOptions()">分析并生成50种专属方案</button>
    </div>

    <!-- 2. 样式挑选方案界面 -->
    <div id="step-select" class="box hidden">
        <h3 style="margin-top:0; color:#ff69b4;">✨ 已为你量身定制50款方案</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">点击下方任意一款方案即可预览最终动效与音乐</p>
        <div class="style-list" id="style-list-container"></div>
        <button class="btn" style="background:#4a215d;" onclick="goBackToConfig()">返回修改信息</button>
    </div>

    <!-- 3. 最终贺卡展示界面 -->
    <div id="step-card" class="box hidden">
        <div id="lock-badge-notice" class="lock-badge hidden">🔒 该贺卡已封装完毕并锁定</div>
        <div class="cake-icon wobble" id="card-icon">🎂</div>
        <h1 id="card-name">祝你生日快乐</h1>
        <p class="blessing" id="card-text"></p>
        <button class="btn" onclick="triggerQRSeal()">生成分享二维码</button>
        <button class="btn" id="reselect-btn" style="background:rgba(255,255,255,0.15); color:#fff; margin-top:10px; box-shadow:none;" onclick="goBackToSelect()">重选样式与音乐</button>
    </div>

    <!-- 二维码遮罩弹窗 -->

            <button class="btn" style="padding:8px; font-size:0.8rem; margin-top: 10px;" onclick="closeQR()">确认并退出</button>
        </div>
    </div>

                "见字如面，顺遂无忧。没有什么华丽的辞藻，只愿你卡里有钱、眼里有光、心里有爱、身边有我。",

                "愿生活对你多一点偏心，愿那些你期待的温柔，都会在今天不经意间撞进你的怀里。见信快乐！",
                "很高兴能在这个团队/生活中遇到像你这样靠谱又温柔的伙伴。新的一年，愿你万事顺遂，快乐搞钱！",
                "谢谢你在我最迷茫无助的时候毫无保留地帮助我，这份温暖我一直记在心里。祝你越来越优秀，开心无限！",
                "优秀的你就像一面镜子，总是能带给我满满的正能量。愿你每天闪闪发光，在生活里尽情享受当下。",
                "愿新的一年里，你的方案一稿过，烦恼全不见！工作/学业之余，也别忘了好好生活、好好爱自己。",
                "职场/学业漫漫，风浪难免，但只要想到同行者里有你，就觉得没什么难关是过不去的。祝天天开心，步步高升！",
                "很高兴我们不仅是默契的搭档，更成为了生活里可以交心的真诚朋友。祝你天天开心，天天有好心情！",
                "祝你开心快乐！愿你保持热爱，奔赴山海，在工作中乘风破浪，在生活里得偿所愿，一起变成更厉害的人呀！",
                "生活冷冰冰，但好在有你递过来的那份真诚，让那些疲惫高压的下午也多了一丝甜意。谢谢你的陪伴。",
                "愿新的一年里，你的钱包鼓鼓，心情美美，每天都过得像过节一样。简单俗气，但最实在！",
                "谢谢你参与了我的过去，也希望你不要缺席我的未来。我们要一直好下去，好到岁月的尽头。",
                "愿你每天清晨醒来，都能看到满树的繁花和满眼的希望。你是无可替代的，加油！",
                "岁月会淘汰掉很多人，但把最真诚的你留给了我。愿你所有的梦想都掷地有声，万事大吉。",
                "谢谢你一直以来当我的正能量充电宝。今天，特意为你注入满满的祝福：愿你岁岁平安，步步高升！",
                "愿你走过的路，都繁花似锦；愿你听到的歌，都温柔动听。生活再忙，也别忘了准时好好下班吃饭。",
                "谢谢你总是细腻地照顾我的小情绪，有你这样的知己，是我修来的福气。愿时光对你温柔一点，再温柔一点。",
                "最后一句话，送给并肩走在人生路上的我们。愿我们都能在追求梦想的同时不忘初心，活得热烈、闪闪发光！"
            ]
        };

        let currentScene = "birthday"; let currentTargetName = ""; let customText = ""; let particleIntervalId = null; let isLocked = false; 
        let activeKeyIndex = -1; 

        // 🌟 核心技术升级点一：开机自动用异步管道读取平级目录下的 keys.txt
        async function loadKeysPoolFromTxt() {
            try {
                // 用无源嗅探向当前站点的 keys.txt 索要卡密数据
                const response = await fetch('keys.txt?t=' + Date.now()); // 加时间戳阻断手机浏览器顽固缓存
                if (!response.ok) { console.error("无法加载外部keys.txt文件"); return; }
                const rawText = await response.text();
                
                // 通过换行符切割，并剔除空格和空行
                SECRET_KEY_POOL = rawText.split(/\r?\n/).map(k => k.trim()).filter(k => k.length > 0);
                console.log(`成功同步外部卡密母库！当前载入数量：${SECRET_KEY_POOL.length}个`);
            } catch (error) {
                console.error("异步加载外部卡密异常: ", error);
            }
        }

        window.onload = async function() {
            // 1. 率先拉取外部 txt 里的上千个密码库存
            await loadKeysPoolFromTxt();

            const urlParams = new URLSearchParams(window.location.search);
            const isDirectShow = urlParams.get('direct'); 
            const nameData = urlParams.get('name');
            const textData = urlParams.get('text');
            const typeParam = urlParams.get('type');

            if (isDirectShow === "1") {
                if(typeParam && sceneConfig[typeParam]) currentScene = typeParam;
                currentTargetName = nameData ? decodeURIComponent(nameData) : "神秘嘉宾";
                customText = textData ? decodeURIComponent(textData) : "";
                document.getElementById('step-auth').classList.add('hidden');
                document.getElementById('step-config').classList.add('hidden');
                document.getElementById('step-select').classList.add('hidden');
                const dynamicPool = buildDynamic50Styles(currentScene);
                renderFinalCard(dynamicPool[0]);
                return; 
            }
        }

        // 🔑 验证输入逻辑（大小写敏感精确校对）
        function verifyInputKey() {
            const inputVal = document.getElementById('input-key').value.trim(); 
            if (!inputVal) { alert("⚠️ 请先输入验证卡密！"); return; }

            // 在从 txt 读取过来的数组中检索
            activeKeyIndex = SECRET_KEY_POOL.indexOf(inputVal);

            if (activeKeyIndex === -1) {
                alert("❌ 验证失败！验证卡密不正确、不存在或已过期。请注意区分大小写。");
                return;
            }

            document.getElementById('step-auth').classList.add('hidden');
            document.getElementById('step-config').classList.remove('hidden');
            switchSceneMode();
        }

        function switchSceneMode() {
            currentScene = document.getElementById('input-scene').value;
            const cfg = sceneConfig[currentScene];
            document.getElementById('label-name').innerText = cfg.label;
            document.body.style.background = cfg.defaultBg;
            updateInspirationList(); 
        }

        function updateInspirationList() {
            const name = document.getElementById('input-name').value.trim() || "TA";
            const container = document.getElementById('inspiration-list');
            if(!container) return; container.innerHTML = "";
            const pool = blessingWording[currentScene];
            if(pool) {
                pool.forEach(text => {
                    let processedText = text.replace(/TA/g, name);
                    const item = document.createElement('div');
                    item.className = 'inspiration-item'; item.innerText = processedText;
                    item.onclick = function() { document.getElementById('input-custom-text').value = processedText; };
                    container.appendChild(item);
                });
            }
        }

        function buildDynamic50Styles(scene) {
            const cfg = sceneConfig[scene]; let extendedPool = [];
            for (let i = 0; i < 50; i++) {
                const base = baseStyles[i % baseStyles.length]; const prefixWord = cfg.p[i % cfg.p.length];
                extendedPool.push({
                    id: i + 1, name: `${prefixWord}${base.name}`, desc: `${base.desc} | ${cfg.name}尊享方案`,
                    bg: base.bg, textStyle: base.textStyle, icon: base.icon || cfg.icon, particles: cfg.tags.concat(['✨'])
                });
            }
            return extendedPool;
        }

        function generateStyleOptions() {
            const nameInput = document.getElementById('input-name').value.trim();
            if(!nameInput) { alert("请先输入称呼或名字哦！"); return; }
            currentTargetName = nameInput; customText = document.getElementById('input-custom-text').value.trim();
            const listContainer = document.getElementById('style-list-container');
            listContainer.innerHTML = ""; 
            const dynamicStyles = buildDynamic50Styles(currentScene);
            dynamicStyles.forEach(style => {
                const item = document.createElement('div'); item.className = 'style-item';
                item.onclick = () => renderFinalCard(style);
                item.innerHTML = `<div class="style-name">${style.id}. ${style.name} ${style.icon}</div><div class="style-desc">${style.desc}</div>`;
                listContainer.appendChild(item);
            });
            document.getElementById('step-config').classList.add('hidden');
            document.getElementById('step-select').classList.remove('hidden');
        }

        function renderFinalCard(style) {
            document.body.style.background = style.bg; const cardName = document.getElementById('card-name');
            cardName.innerText = `${currentTargetName} · ${sceneConfig[currentScene].title}`;
            cardName.style.textShadow = style.textStyle; document.getElementById('card-icon').innerText = style.icon;
            if (customText) { document.getElementById('card-text').innerText = customText; } 
            else { const texts = blessingWording[currentScene]; document.getElementById('card-text').innerText = texts[Math.floor(Math.random() * texts.length)].replace(/TA/g, currentTargetName); }
            const music = document.getElementById('bg-music'); music.src = sceneConfig[currentScene].music;
            music.play().catch(err => { console.log("等待交互: ", err); });
            if(particleIntervalId) clearInterval(particleIntervalId);
            document.querySelectorAll('.particle').forEach(p => p.remove());
            particleIntervalId = setInterval(() => createParticle(style.particles), 350);
            document.getElementById('step-select').classList.add('hidden');
            document.getElementById('step-card').classList.remove('hidden');
        }

        function createParticle(particlePool) {
            const particle = document.createElement('div'); particle.className = 'particle';
            particle.innerText = particlePool[Math.floor(Math.random() * particlePool.length)];
            particle.style.left = Math.random() * 100 + 'vw'; particle.style.fontSize = Math.random() * 15 + 14 + 'px';
            particle.style.animationDuration = Math.random() * 4 + 3 + 's'; document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 6000);
        }

        function goBackToConfig() {
            if(isLocked) return; document.getElementById('step-select').classList.add('hidden');
            document.getElementById('step-config').classList.remove('hidden'); switchSceneMode(); 
        }
        
        function goBackToSelect() {
            if(isLocked) return; document.getElementById('step-card').classList.add('hidden');
            document.getElementById('step-select').classList.remove('hidden'); document.body.style.background = "#11091c"; 
            if(particleIntervalId) clearInterval(particleIntervalId); document.querySelectorAll('.particle').forEach(p => p.remove());
            document.getElementById('bg-music').pause();
        }

        function triggerQRSeal() {
            if (isLocked) { document.getElementById('qrMask').classList.add('show'); return; }
            const confirmSeal = confirm("⚠️ 封装确认提示：\n\n生成分享二维码后，当前贺卡将被锁定，且本个专属卡密将【立刻失效报废】。是否确认完成封装？");
            if (confirmSeal) {
                isLocked = true; 
                
                // 🔒 运行内存实时隔离销毁
                if (activeKeyIndex !== -1) {
                    SECRET_KEY_POOL.splice(activeKeyIndex, 1); 
                    activeKeyIndex = -1; 
                }
                
                document.getElementById('reselect-btn').classList.add('hidden');
                document.getElementById('lock-badge-notice').classList.remove('hidden');
                executeQRGeneration();
            }
        }

        function executeQRGeneration() {
            const mask = document.getElementById('qrMask'); const qrcodeDiv = document.getElementById('qrcode');
            mask.classList.add('show'); qrcodeDiv.innerHTML = ""; 
            let currentUrl = window.location.href.split('?')[0]; 
            let qrUrl = `${currentUrl}?type=${currentScene}&name=${encodeURIComponent(currentTargetName)}&text=${encodeURIComponent(customText)}&direct=1`;
            if(window.location.href.startsWith('file://')) { qrUrl = `https://github.com/`; }
            new QRCode(qrcodeDiv, { text: qrUrl, width: 160, height: 160, colorDark : "#11091c", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
        }

        function closeQR() { 
            document.getElementById('qrMask').classList.remove('show');
            window.location.reload(); 
        }
    </script>
</body>
