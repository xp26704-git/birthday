<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全场景全节日贺卡高级定制系统</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body {
            margin: 0; padding: 0; background: #11091c;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden; color: #fff;
        }

        /* 统一卡片样式 */
        .box {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); border-radius: 24px; padding: 30px 20px;
            width: 90%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        /* 表单界面样式 */
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: #d1c4e9; margin-bottom: 6px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
            color: #fff; font-size: 1rem; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: #ff69b4; box-shadow: 0 0 10px rgba(255,105,180,0.5); }
        textarea { resize: none; height: 80px; font-size: 0.9rem; }

        /* 灵感备选词库区域 */
        .inspiration-box {
            background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(255, 105, 180, 0.4);
            border-radius: 12px; padding: 12px; margin-top: 8px; text-align: left;
        }
        .inspiration-title { font-size: 0.8rem; color: #ff69b4; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
        .inspiration-list { max-height: 150px; overflow-y: auto; padding-right: 4px; }
        .inspiration-list::-webkit-scrollbar { width: 4px; }
        .inspiration-list::-webkit-scrollbar-thumb { background: rgba(255, 105, 180, 0.5); border-radius: 4px; }
        .inspiration-item {
            font-size: 0.8rem; color: #e0e0e0; padding: 8px; border-radius: 6px;
            background: rgba(255,255,255,0.03); margin-bottom: 6px; cursor: pointer;
            line-height: 1.5; border: 1px solid transparent; word-break: break-all;
        }
        .inspiration-item:hover { background: rgba(255, 105, 180, 0.1); border-color: rgba(255, 105, 180, 0.3); color: #fff; }

        /* 样式选择列表 */
        .style-list { max-height: 300px; overflow-y: auto; margin: 15px 0; padding-right: 5px; text-align: left; }
        .style-list::-webkit-scrollbar { width: 5px; }
        .style-list::-webkit-scrollbar-thumb { background: #ff69b4; border-radius: 10px; }
        
        .style-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer;
        }
        .style-item:hover { background: rgba(255,105,180,0.15); border-color: #ff69b4; transform: scale(1.02); }
        .style-name { font-weight: bold; color: #ff8da1; font-size: 1rem; margin-bottom: 3px; }
        .style-desc { font-size: 0.8rem; color: #e0e0e0; line-height: 1.4; }

        /* 最终贺卡效果 */
        .cake-icon { font-size: 5rem; margin-bottom: 10px; display: inline-block; }
        .wobble { animation: wobbleAnim 2.5s ease-in-out infinite; }
        @keyframes wobbleAnim {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }
        h1 { font-size: 2rem; margin: 10px 0; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .blessing { font-size: 1.1rem; line-height: 1.8; margin: 20px 0; padding: 15px; border-radius: 12px; text-align: left; word-break: break-all; }

        .lock-badge {
            background: rgba(255, 65, 108, 0.2); border: 1px solid #ff416c;
            color: #ff8da1; font-size: 0.8rem; padding: 4px 12px; border-radius: 20px;
            display: inline-block; margin-bottom: 15px; font-weight: bold;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none;
            padding: 12px 28px; border-radius: 50px; font-size: 1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4); width: 100%;
        }
        .btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }

        /* 二维码弹窗层 */
        .qr-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none;
        }
        .qr-mask.show { opacity: 1; pointer-events: auto; }
        .qr-box { background: #fff; padding: 25px; border-radius: 20px; text-align: center; color: #333; width: 280px; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; padding: 5px; background: #fff; }

        .particle { position: fixed; top: -10px; pointer-events: none; animation: fall linear infinite; z-index: 1; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop src="https://music.163.com/song/media/outer/url?id=4948834.mp3"></audio>

    <div id="step-auth" class="box">
        <h2 style="margin-top:0; color:#ff69b4;">🔑 专属密码验证</h2>
        <p style="font-size:0.85rem; color:#aaa; line-height:1.5; margin-bottom:20px;">欢迎来到高级贺卡定制大厅！<br>请在下方输入您从小红书店铺获取的专属验证卡密：</p>
        <div class="form-group">
            <input type="text" id="input-key" placeholder="请输入您的16位验证卡密..." style="text-align:center; font-size: 0.85rem; letter-spacing: 1px;">
        </div>
        <button class="btn" onclick="verifyInputKey()">解锁定制大厅</button>
    </div>

    <div id="step-config" class="box hidden">
        <h2 style="margin-top:0; color:#ff69b4;">💝 贺卡高级定制中心</h2>
        
        <div class="form-group">
            <label>1. 选择贺卡祝福主题</label>
            <select id="input-scene" onchange="switchSceneMode()">
                <option value="birthday">🎂 生日贺卡</option>
                <option value="valentine">🌹 情人节 / 浪漫告白</option>
                <option value="mother">💐 母亲节贺卡</option>
                <option value="father">👔 父亲节贺卡</option>
                <option value="midautumn">🥮 中秋节贺卡</option>
                <option value="children">🎈 儿童节贺卡</option>
                <option value="teacher">👨‍🏫 教师节贺卡</option>
                <option value="police">👮 警察节贺卡</option>
                <option value="universal">✉️ 万能通用祝福卡</option>
            </select>
        </div>
        
        <div class="form-group">
            <label id="label-name">2. 姓名 / 称呼</label>
            <input type="text" id="input-name" placeholder="例如：宝贝、老妈、张老师" oninput="updateInspirationList()">
        </div>
        
        <div class="form-group">
            <label>3. 专属祝福寄语</label>
            <textarea id="input-custom-text" placeholder="可直接点击下方灵感文案一键复制，或在这里手写悄悄话..."></textarea>
            
            <div class="inspiration-box">
                <div class="inspiration-title">✨ 肖哥私人灵感文案库 (基于主题自动切换)</div>
                <div class="inspiration-list" id="inspiration-list"></div>
            </div>
        </div>
        
        <button class="btn" onclick="generateStyleOptions()">分析并生成50种专属方案</button>
    </div>

    <div id="step-select" class="box hidden">
        <h3 style="margin-top:0; color:#ff69b4;">✨ 已为你量身定制50款方案</h3>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom:10px;">点击下方任意一款方案即可预览最终动效与音乐</p>
        <div class="style-list" id="style-list-container"></div>
        <button class="btn" style="background:#4a215d;" onclick="goBackToConfig()">返回修改信息</button>
    </div>

    <div id="step-card" class="box hidden">
        <div id="lock-badge-notice" class="lock-badge hidden">🔒 该贺卡已封装完毕并锁定</div>
        <div class="cake-icon wobble" id="card-icon">🎂</div>
        <h1 id="card-name">祝你生日快乐</h1>
        <p class="blessing" id="card-text"></p>
        <button class="btn" onclick="triggerQRSeal()">生成分享二维码</button>
        <button class="btn" id="reselect-btn" style="background:rgba(255,255,255,0.15); color:#fff; margin-top:10px; box-shadow:none;" onclick="goBackToSelect()">重选样式与音乐</button>
    </div>

    <div class="qr-mask" id="qrMask" onclick="closeQR()">
        <div class="qr-box" onclick="event.stopPropagation()">
            <h3 style="margin: 0 0 10px 0; font-size: 1.1rem; color:#11091c;">🎁 贺卡封装完毕</h3>
            <div id="qrcode"></div>
            <p style="font-size:0.8rem; color:#666; line-height: 1.4;">✨ 手机截屏保存此二维码<br>发给TA，扫码即可查收惊喜与音乐！</p>
            <button class="btn" style="padding:8px; font-size:0.8rem; margin-top: 10px;" onclick="closeQR()">确认并退出</button>
        </div>
    </div>

    <script>
        // 🔒 外部动态载入池
        let SECRET_KEY_POOL = [];

        const sceneConfig = {
            birthday: { name: "生日贺卡", title: "祝 TA 生日快乐", label: "2. 姓名 / 称呼", icon: "🎂", music: "https://music.163.com/song/media/outer/url?id=4948834.mp3", defaultBg: "#11091c", p: ["璀璨·", "专属·", "流金·", "定格·", "永恒·"], tags: ["🌸", "🎂", "✨"] },
            midautumn: { name: "中秋节贺卡", title: "中秋佳节·阖家团圆", label: "2. 姓名 / 称呼", icon: "🥮", music: "https://music.163.com/song/media/outer/url?id=5264642.mp3", defaultBg: "#0d1b2a", p: ["广寒·", "月华·", "秋夕·", "团圆·", "婵娟·"], tags: ["🌙", "🐇", "✨"] },
            valentine: { name: "情人节/告白贺卡", title: "浪漫告白·一眼万年", label: "2. 姓名 / 称呼", icon: "🌹", music: "https://music.163.com/song/media/outer/url?id=1432130302.mp3", defaultBg: "#2b0f1a", p: ["热恋·", "心动·", "缱绻·", "至死不渝·", "独家·"], tags: ["❤️", "💖", "🌹"] },
            father: { name: "父亲节贺卡", title: "父爱如山·感恩有您", label: "2. 姓名 / 称呼", icon: "👔", music: "https://music.163.com/song/media/outer/url?id=139774.mp3", defaultBg: "#102a43", p: ["如山·", "脊梁·", "深沉·", "致敬·", "岁月·"], tags: ["🍀", "✨", "❤️"] },
            mother: { name: "母亲节贺卡", title: "岁月温柔·致敬妈妈", label: "2. 姓名 / 称呼", icon: "💐", music: "https://music.163.com/song/media/outer/url?id=34341358.mp3", defaultBg: "#2d1226", p: ["温柔·", "康乃馨·", "岁华·", "春晖·", "挚爱·"], tags: ["🌸", "💐", "❤️"] },
            children: { name: "儿童节贺卡", title: "保持童心·快乐无边", label: "2. 姓名 / 称呼", icon: "🎈", music: "https://music.163.com/song/media/outer/url?id=5255444.mp3", defaultBg: "#163832", p: ["无邪·", "童趣·", "星愿·", "元气·", "稚子·"], tags: ["🎈", "🍭", "⭐"] },
            teacher: { name: "教师节贺卡", title: "桃李满天下·师恩难忘", label: "2. 姓名 / 称呼", icon: "👨‍🏫", music: "https://music.163.com/song/media/outer/url?id=134489.mp3", defaultBg: "#1f2421", p: ["微光·", "春蚕·", "桃李·", "领航·", "烛照·"], tags: ["📚", "✨", "🍀"] },
            police: { name: "警察节贺卡", title: "致敬藏蓝·平安守护", label: "2. 姓名 / 称呼", icon: "👮", music: "https://music.163.com/song/media/outer/url?id=516654157.mp3", defaultBg: "#0b2545", p: ["藏蓝·", "热血·", "正义·", "坚守·", "荣耀·"], tags: ["⚡", "⭐", "🛡️"] },
            universal: { name: "万能通用卡", title: "见字如面·顺遂无忧", label: "2. 姓名 / 称呼", icon: "✉️", music: "https://music.163.com/song/media/outer/url?id=1808492017.mp3", defaultBg: "#1c1c1c", p: ["如意·", "安康·", "锦时·", "知音·", "流岁·"], tags: ["✨", "🍀", "✉️"] }
        };

        // 🌟 核心重构与对齐：180条神仙级文案库，键值与下拉菜单英文100%像素级闭合对齐
        const blessingWording = {
            birthday: [

                "世界上有那么多风景，但最让我心动的，依然是吹过你发梢的微风，和今天点燃蜡烛时你眼里的星光。",

            valentine: [
